<link rel="stylesheet" href="../gun/kit/web.css"><link rel="stylesheet" href="../app.css">
<script src="../gun/kit/web.js"></script><script src="../gun/kit/dom.js"></script>

<form class="leaf" id="form" autocomplete="off">
  <div class="fill rise">
    <p class="kick">Members only <span class="wine" id="test" hidden>· Test group</span></p>
    <h1 class="head">What’s the password?</h1>
    <p class="lede">The one your host shared with you privately. It unlocks the group and encrypts everything you share.</p>
    <input class="field line" id="pass" type="password" placeholder="Password…" autocomplete="current-password" enterkeyhint="go" required>
    <p class="fine wine" id="oops" hidden></p>
    <button class="ghost" type="button" id="make" hidden>Start a new group with this password</button>
  </div>
  <div class="bar">
    <button class="ghost round" type="button" id="back" aria-label="Back">←</button>
    <button class="go grow" id="next" disabled>Unlock <span>→</span></button>
  </div>
</form>

<style>
.fill { gap: 1.1rem; }
.field.line { margin-top: 1rem; letter-spacing: 0.1em; }
#make { margin-top: 0.5rem; }
</style>

<script>
kit.createServer(function(req, res){
  test.hidden = !(req.body || {}).test;
  res.send(document);
});

var PASS = {};
PASS.word = {
  404: 'No group uses this password yet. Check it with your host, or start a new group with it.',
  403: 'That password doesn’t open this group.',
  500: 'We couldn’t reach the group. Check your connection and try again.'
};
PASS.send = function(start){
  if(!pass.value){ return }
  next.disabled = make.disabled = true; oops.hidden = true;
  next.firstChild.textContent = 'Unlocking… ';
  kit.say({to:'pass', pass: pass.value, make: !!start}, 'go');
};
pass.oninput = () => { next.disabled = !pass.value; make.hidden = true; oops.hidden = true };
form.onsubmit = eve => { eve.preventDefault(); PASS.send() };
make.onclick = () => PASS.send(1);
back.onclick = () => kit.say({to:'back'}, 'go');
kit.ear('oops', function(eve, code){
  code = (eve.detail || {}).code;
  oops.textContent = PASS.word[code] || PASS.word[500]; oops.hidden = false;
  make.hidden = 404 !== code; make.disabled = false;
  next.disabled = false; next.firstChild.textContent = 'Unlock ';
});
</script>
