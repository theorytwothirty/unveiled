<link rel="stylesheet" href="../gun/kit/web.css"><link rel="stylesheet" href="../app.css">
<script src="../gun/kit/web.js"></script><script src="../gun/kit/dom.js"></script>

<div class="leaf">
  <div class="fill rise">
    <p class="kick">After Dark</p>
    <span class="moon"></span>
    <h1 class="big">A little deeper…</h1>
    <p class="sub">Feeling adventurous?</p>
    <p class="lede">These last four questions are completely optional. Share only what feels comfortable — you can keep any answer private on the review screen.</p>
  </div>
  <div class="bar">
    <button class="ghost round" id="back" aria-label="Back">←</button>
    <button class="link" id="skip">Skip</button>
    <button class="go grow" id="next">Let’s explore <span>→</span></button>
  </div>
</div>

<style>
.fill { gap: 1.25rem; }
.big { font-size: clamp(3rem, 14vw, 5.5rem); text-transform: none; letter-spacing: 0; font-style: italic; }
.moon { width: 3.5rem; height: 3.5rem; border-radius: 50%; margin: 0.5rem 0;
  box-shadow: inset -0.9rem -0.3rem 0 0 var(--wine); transform: rotate(-20deg); animation: glow 4s ease-in-out infinite alternate; }
@keyframes glow { from { opacity: 0.7; } to { opacity: 1; filter: drop-shadow(0 0 1rem var(--glow)); } }
</style>

<script>
kit.createServer(function(req, res){
  document.documentElement.tag('dark', 1);
  res.send(document);
});
back.onclick = () => kit.say({to:'back'}, 'go');
next.onclick = () => kit.say({to:'deep'}, 'go');
skip.onclick = () => kit.say({to:'look'}, 'go');
</script>
