<link rel="stylesheet" href="../gun/kit/web.css"><link rel="stylesheet" href="../app.css">
<script src="../gun/kit/web.js"></script><script src="../gun/kit/dom.js"></script>

<div class="leaf wide">
  <header class="pile lead rise">
    <div class="side ends"><p class="kick">Members only</p><button class="link swap" id="swap">Switch group ↺</button></div>
    <h1 class="big wine">The Unveiled Collective</h1>
    <p class="sub">Get to know the people behind the names.</p>
    <p class="kick tally" name="tally"></p>
    <p class="fine" id="slow" hidden>Gathering everyone…</p>
  </header>
  <div class="grid" id="grid"></div>
  <footer class="pile foot">
    <div class="side wrap">
      <button class="ghost" id="mine">Edit my answers</button>
      <button class="link" id="cut">Delete my answers</button>
    </div>
    <p class="fine">What’s shared here stays here. Please don’t screenshot or pass on anyone’s answers without their permission.</p>
  </footer>
</div>

<template id="model">
  <button class="card person">
    <span class="side ends"><span class="mono" name="mono"></span><span class="kick"><span class="you">You · </span><span name="told"></span></span></span>
    <span class="name" name="name"></span>
    <span class="line" name="line"></span>
    <span class="rule"></span>
    <span class="more">Discover <b name="first"></b> →</span>
  </button>
</template>

<style>
.lead { gap: 0.9rem; padding: 2rem 0 2.25rem; }
.big { font-size: clamp(2.8rem, 12vw, 5.5rem); text-transform: uppercase; }
.tally { color: var(--wine); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 17rem), 1fr)); gap: 1rem; }
.person { display: grid; gap: 0.6rem; text-align: left; place-items: stretch; cursor: pointer; color: var(--ink);
  border: 0; padding: 1.5rem; animation: rise 0.7s var(--ease) both; transition: transform 0.35s var(--ease), box-shadow 0.35s; }
.person:hover, .person:focus-visible { transform: translateY(-4px); background: var(--card); color: var(--ink);
  box-shadow: 0 1px 2px rgba(41,37,37,0.04), 0 22px 50px -18px rgba(114,47,69,0.28); }
.person:active { transform: scale(0.98); }
.person::after { content: ''; position: absolute; inset: 0.5rem; border-radius: 1.1rem; border: 1px solid var(--line); pointer-events: none; }
.person:nth-child(2) { animation-delay: 0.08s; } .person:nth-child(3) { animation-delay: 0.16s; } .person:nth-child(n+4) { animation-delay: 0.24s; }
.you { display: none; color: var(--wine); } .person.mine .you { display: inline; }
.name { font-family: var(--serif); font-size: 2.2rem; line-height: 1; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 0.75rem; }
.line { font-family: var(--serif); font-style: italic; font-size: 1.15rem; color: var(--soft); min-height: 1.6em; }
.more { color: var(--wine); font-weight: 500; }
.foot { gap: 0.75rem; padding: 2.5rem 0 max(2rem, env(safe-area-inset-bottom)); }
.wrap { flex-wrap: wrap; }
#cut.sure { color: var(--wine); font-weight: 500; }
.swap { padding-right: 0; color: var(--wine); }
</style>

<script>
// first whoever is already known, then everyone else as they arrive (the 'person' stream below)
kit.createServer(function(req, res){
  var c = req.body || {};
  ALL.all = c.all || 10; ALL.me = c.me; ALL.data = {}; ALL.els = {};
  grid.replaceChildren();
  (c.list || []).forEach(ALL.put);
  ALL.sum();
  res.send(document);
});

var ALL = {data: {}, els: {}};
ALL.put = function(one){
  if(one.gone){ ALL.els[one.id] && ALL.els[one.id].remove(); delete ALL.els[one.id]; delete ALL.data[one.id]; return }
  ALL.data[one.id] = one;
  ALL.els[one.id] ? ALL.fill(ALL.els[one.id], one) : ALL.card(one);
};
ALL.sum = function(n, told){
  n = Object.keys(ALL.data).length;
  told = Object.values(ALL.data).reduce((t, one) => t + one.told, 0);
  kit.bind(document, {tally: n + (1 === n ? ' person. ' : ' people. ') + told + ' stories. A little more connection.'});
  slow.hidden = !!n;
};
ALL.lines = ['A little mystery. A little magic.', 'Soft words. Bold heart.', 'Curious, and not afraid to say so.',
  'Still waters. Warm currents.', 'Equal parts honey and heat.', 'A slow burn worth waiting for.', 'Open door. Gentle hands.'];
ALL.pick = (name, h) => { h = 0; for(var i = 0; i < name.length; i++){ h = (h * 31 + name.charCodeAt(i)) >>> 0 } return ALL.lines[h % ALL.lines.length] };
ALL.fill = (el, one) => kit.bind(el, {
  mono: one.name.charAt(0).toUpperCase(), name: one.name, first: one.name, line: ALL.pick(one.name),
  told: one.told + ' of ' + ALL.all + ' shared' });
ALL.card = function(one, el){
  el = ALL.els[one.id] = ALL.fill(model.content.firstElementChild.cloneNode(true), one);
  el.tag('mine', one.id === ALL.me ? 1 : -1);
  el.onclick = () => kit.say({to:'one', who: one.id}, 'go');
  grid.pin(el);
};
kit.ear('person', eve => { ALL.put(eve.detail || {}); ALL.sum() });

mine.onclick = () => kit.say({to:'mine'}, 'go');
swap.onclick = () => kit.say({to:'swap'}, 'go');
cut.onclick = function(){
  if(!cut.classList.contains('sure')){ cut.tag('sure', 1); cut.textContent = 'Tap again to delete for good'; return }
  kit.say({to:'cut'}, 'go');
};
</script>
